<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #24324a; background: #eef7ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      .card { width: min(94vw, 560px); padding: 36px 28px; text-align: center; background: #fff; border-radius: 28px; box-shadow: 0 14px 38px #1f57972e; }
      h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3rem); }
      p { line-height: 1.6; }
      .icon { font-size: 58px; }
      form { display: grid; gap: 14px; margin: 26px 0 8px; text-align: left; }
      label { font-weight: 700; }
      select, input, button { min-height: 50px; border-radius: 14px; font: inherit; }
      select, input { width: 100%; padding: 10px 14px; border: 2px solid #cbdcf6; background: #fff; }
      button { padding: 10px 20px; border: 0; background: #4d86f7; color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .7; }
      .notice { min-height: 25px; color: #b42318; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="icon" class="icon" aria-hidden="true"></div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <form id="loginForm">
        <label><span id="accountLabel"></span><select id="account" required>
          <option value="admin" data-label="account.allen"></option>
          <option value="amy" data-label="account.amy"></option>
          <option value="shirlyn" data-label="account.shirlyn"></option>
        </select></label>
        <label><span id="passwordLabel"></span><input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="submit" type="submit"></button>
      </form>
      <p id="loginNotice" class="notice" aria-live="polite"></p>
    </main>

    <script type="module">
      import { auth, db, signInWithEmailAndPassword, onAuthStateChanged, doc, getDoc } from "./js/firebase.js";
      import { loadUI, t } from "./js/i18n.js";

      const $ = (selector) => document.querySelector(selector);
      const accounts = {
        admin: "wang.yilun.allen@gmail.com",
        amy: "wang.yilun.allen+amy@gmail.com",
        shirlyn: "wang.yilun.allen+shirlyn@gmail.com"
      };

      await loadUI();
      document.title = t("app.title");
      $("#icon").textContent = t("login.icon");
      $("#title").textContent = t("login.title");
      $("#subtitle").textContent = t("login.subtitle");
      $("#accountLabel").textContent = t("login.accountLabel");
      $("#passwordLabel").textContent = t("login.passwordLabel");
      $("#submit").textContent = t("login.submit");
      document.querySelectorAll("[data-label]").forEach((option) => { option.textContent = t(option.dataset.label); });

      $("#loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = accounts[$("#account").value];
        $("#submit").disabled = true;
        $("#loginNotice").textContent = t("login.verifying");
        try {
          await signInWithEmailAndPassword(auth, email, $("#password").value);
          $("#password").value = "";
        } catch {
          $("#loginNotice").textContent = t("login.invalid");
          $("#submit").disabled = false;
        }
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        try {
          const profile = await getDoc(doc(db, "users", user.uid));
          if (!profile.exists()) {
            $("#loginNotice").textContent = t("login.profileMissing");
            $("#submit").disabled = false;
            return;
          }
          if (profile.data().role === "admin") {
            location.replace("admin.html");
            return;
          }
          const dragon = await getDoc(doc(db, "users", user.uid, "dragon", "current"));
          location.replace(dragon.exists() ? "home.html" : "journey.html");
        } catch (error) {
          console.error("Unable to route signed-in user", error);
          $("#loginNotice").textContent = t("login.profileError");
          $("#submit").disabled = false;
        }
      });
    </script>
  </body>
</html>
