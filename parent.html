<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="css/parent.css" />
  </head>
  <body>
    <main aria-live="polite">
      <section class="panel">
        <h1 id="title"></h1>
        <p id="intro" class="intro"></p>
        <p id="status" role="status"></p>
      </section>

      <section class="panel guardian-panel" aria-labelledby="guardianTitle">
        <h2 id="guardianTitle"></h2>
        <p id="guardianHelp" class="help"></p>
        <p id="guardianStatus" class="notice" role="status"></p>
        <div id="guardianChoices" class="guardian-grid"></div>
      </section>

      <section class="panel" aria-labelledby="requestTitle">
        <h2 id="requestTitle"></h2>
        <p id="requestHelp" class="help"></p>
        <form id="requestForm">
          <label><span id="requestChildLabel"></span><select id="requestChild" required></select></label>
          <button id="requestSubmit" type="submit"></button>
        </form>
        <p id="requestStatus" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="linkedTitle">
        <h2 id="linkedTitle"></h2>
        <div id="linkedChildren"></div>
      </section>
    </main>
    <script type="module" src="js/parent-page.js?v=20261117-practice-history"></script>
  </body>
</html>
