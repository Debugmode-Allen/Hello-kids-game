<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      :root { color: #172554; font-family: "Microsoft YaHei", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 76px 20px 32px; background: linear-gradient(160deg, #e0f2fe, #f5f3ff); }
      .admin-card { width: min(100%, 760px); margin: 0 auto; padding: 32px 28px; background: rgba(255,255,255,.96); border-radius: 28px; box-shadow: 0 18px 45px rgba(30,64,175,.14); }
      h1 { margin: 0 0 8px; text-align: center; font-size: clamp(1.7rem, 5vw, 2.3rem); }
      .intro { margin: 0 0 24px; text-align: center; color: #475569; }
      .child-card { margin: 14px 0; padding: 20px; border-radius: 18px; background: #eff6ff; }
      .child-card h2 { margin: 0 0 12px; color: #1e3a8a; font-size: 1.25rem; }
      .child-card p { margin: 7px 0; color: #334155; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 17px; }
      .attribute-editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 18px; padding: 16px; border-radius: 14px; background: #fff; }
      .attribute-editor h3 { grid-column: 1 / -1; margin: 0; font-size: 1rem; }
      .attribute-editor label { display: grid; gap: 5px; color: #475569; font-size: .9rem; }
      .attribute-editor input { width: 100%; min-height: 38px; padding: 7px 9px; border: 1px solid #bfdbfe; border-radius: 8px; color: #172554; font: inherit; }
      .attribute-editor button, .attribute-editor p { grid-column: 1 / -1; margin: 0; }
      .save-attributes { background: #2563eb; }
      .form-notice { color: #15803d; font-size: .88rem; }
      button { min-height: 40px; padding: 9px 14px; border: 0; border-radius: 10px; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      .reset-dragon { background: #b45309; }
      .reset-history { background: #b42318; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 1.5em; margin: 16px 0 0; text-align: center; color: #64748b; }
      @media (max-width: 430px) { body { padding: 68px 12px 20px; } .admin-card { padding: 27px 16px; } .actions button { width: 100%; } .attribute-editor { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="admin-card" aria-live="polite">
      <h1 id="pageTitle"></h1>
      <p id="intro" class="intro"></p>
      <section id="children"></section>
      <p id="status"></p>
    </main>

    <script type="module">
      import { auth, db, onAuthStateChanged, doc, getDoc, getDocs, collection } from "./js/firebase.js";
      import { resetDragon, resetLearningHistory, updateAssessmentResult, updateDragonAttributes } from "./js/admin-dashboard.js?v=3a105b8";
      import { loadUI, t } from "./js/i18n.js";

      const $ = (selector) => document.querySelector(selector);

      function paragraph(text) {
        const element = document.createElement("p");
        element.textContent = text;
        return element;
      }

      function createResetButton(className, label, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.addEventListener("click", onClick);
        return button;
      }

      function createNumberInput(key, label, value, minimum, maximum = null, required = true) {
        const wrapper = document.createElement("label");
        const labelText = document.createElement("span");
        labelText.textContent = label;
        const input = document.createElement("input");
        input.type = "number";
        input.name = key;
        input.min = minimum;
        input.step = "1";
        if (maximum !== null) input.max = maximum;
        input.required = required;
        input.value = value;
        wrapper.append(labelText, input);
        return wrapper;
      }

      function showAssessmentSummary(child, levels, score) {
        const progress = child.progress;
        levels.textContent = t("admin.learningLevels", {
          chinese: progress?.chineseLevel ?? "-",
          english: progress?.englishLevel ?? "-",
          math: progress?.mathLevel ?? "-"
        });
        score.textContent = t("admin.assessmentScore", {
          correct: progress?.totalCorrect ?? "-", answered: progress?.totalAnswered ?? "-"
        });
      }

      function createAssessmentEditor(child, refreshSummary) {
        const form = document.createElement("form");
        form.className = "attribute-editor";
        const title = document.createElement("h3");
        title.textContent = t("admin.assessmentEditor");
        const info = paragraph(t("admin.assessmentHelp"));
        const progress = child.progress;
        const save = document.createElement("button");
        save.type = "submit";
        save.className = "save-attributes";
        save.textContent = t("admin.assessmentSave");
        const notice = document.createElement("p");
        notice.className = "form-notice";
        notice.setAttribute("role", "status");
        form.append(title, info,
          createNumberInput("chineseLevel", t("admin.assessmentChinese"), progress?.chineseLevel ?? "", 1, 3),
          createNumberInput("englishLevel", t("admin.assessmentEnglish"), progress?.englishLevel ?? "", 3, 5),
          createNumberInput("mathLevel", t("admin.assessmentMath"), progress?.mathLevel ?? "", 3, 5),
          createNumberInput("totalCorrect", t("admin.assessmentCorrect"), progress?.totalCorrect ?? "", 0, null, false),
          createNumberInput("totalAnswered", t("admin.assessmentAnswered"), progress?.totalAnswered ?? "", 0, null, false),
          save, notice
        );
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const result = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, value === "" ? null : Number(value)]));
          save.disabled = true;
          notice.textContent = "";
          try {
            await updateAssessmentResult(child.id, result);
            child.progress = { ...child.progress, ...Object.fromEntries(Object.entries(result).filter(([, value]) => value !== null)) };
            refreshSummary();
            notice.textContent = t("admin.assessmentSaved");
          } catch (error) {
            if (!(error instanceof RangeError)) console.error("Assessment result save failed", error);
            notice.textContent = t(error instanceof RangeError ? "admin.assessmentInvalid" : "admin.assessmentSaveError");
          } finally {
            save.disabled = false;
          }
        });
        return form;
      }

      function createAttributeEditor(child) {
        if (!child.dragon) return null;
        const form = document.createElement("form");
        form.className = "attribute-editor";
        const title = document.createElement("h3");
        title.textContent = t("admin.dragonAttributes");
        form.append(title);
        const stage = child.dragon.stage === "hatchling" ? 1 : (child.dragon.stage ?? 1);
        form.append(
          createNumberInput("stage", t("home.stage"), stage, 1),
          createNumberInput("attack", t("home.attack"), child.dragon.attack ?? 10, 0),
          createNumberInput("defense", t("home.defense"), child.dragon.defense ?? 10, 0),
          createNumberInput("speed", t("home.speed"), child.dragon.speed ?? 10, 0),
          createNumberInput("stamina", t("home.stamina"), child.dragon.stamina ?? 100, 1)
        );
        const save = document.createElement("button");
        save.type = "submit";
        save.className = "save-attributes";
        save.textContent = t("admin.attributeSave");
        const notice = document.createElement("p");
        notice.className = "form-notice";
        form.append(save, notice);
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          save.disabled = true;
          const values = Object.fromEntries(new FormData(form).entries());
          try {
            await updateDragonAttributes(child.id, values);
            notice.textContent = t("admin.attributeSaved");
          } catch (error) {
            console.error("Dragon attribute save failed", error);
            notice.textContent = t("admin.attributeSaveError");
          } finally {
            save.disabled = false;
          }
        });
        return form;
      }

      async function runReset(button, confirmMessage, reset) {
        if (!confirm(confirmMessage)) return;
        button.disabled = true;
        try {
          await reset();
          location.reload();
        } catch (error) {
          console.error("Admin reset failed", error);
          $("#status").textContent = t("admin.resetError");
          button.disabled = false;
        }
      }

      function renderChild(child) {
        const card = document.createElement("article");
        card.className = "child-card";
        const heading = document.createElement("h2");
        heading.textContent = child.name;
        card.append(heading);
        card.append(paragraph(t("admin.dragon", { name: child.dragon?.customName || t("admin.noDragon") })));
        const levels = paragraph("");
        const score = paragraph("");
        const refreshSummary = () => showAssessmentSummary(child, levels, score);
        refreshSummary();
        card.append(levels, score, paragraph(t("admin.attemptCount", { count: child.attemptCount })));
        card.append(createAssessmentEditor(child, refreshSummary));

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(createResetButton("reset-dragon", t("admin.rehatch"), (event) => {
          const message = t("admin.confirmDragonReset", { name: child.name });
          runReset(event.currentTarget, message, () => resetDragon(child.id));
        }));
        actions.append(createResetButton("reset-history", t("admin.clearHistory"), (event) => {
          const message = t("admin.confirmHistoryReset", { name: child.name });
          runReset(event.currentTarget, message, () => resetLearningHistory(child.id));
        }));
        card.append(actions);
        const editor = createAttributeEditor(child);
        if (editor) card.append(editor);
        return card;
      }

      async function loadChildren() {
        const people = await getDocs(collection(db, "users"));
        const children = await Promise.all(people.docs
          .filter((person) => person.data().role === "child")
          .map(async (person) => {
            const [dragonSnapshot, progressSnapshot, attemptsSnapshot] = await Promise.all([
              getDoc(doc(db, "users", person.id, "dragon", "current")),
              getDoc(doc(db, "users", person.id, "progress", "summary")),
              getDocs(collection(db, "users", person.id, "attempts"))
            ]);
            return {
              id: person.id,
              name: person.data().name,
              dragon: dragonSnapshot.exists() ? dragonSnapshot.data() : null,
              progress: progressSnapshot.exists() ? progressSnapshot.data() : null,
              attemptCount: attemptsSnapshot.size
            };
          }));

        const container = $("#children");
        container.replaceChildren();
        if (!children.length) {
          container.append(paragraph(t("admin.noChildren")));
          return;
        }
        children.forEach((child) => container.append(renderChild(child)));
      }

      await loadUI();
      document.title = t("admin.pageTitle");
      $("#pageTitle").textContent = t("admin.pageTitle");
      $("#intro").textContent = t("admin.prompt");
      $("#status").textContent = t("admin.loading");

      onAuthStateChanged(auth, async (user) => {
        if (!user) { location.replace("index.html"); return; }
        try {
          const profile = await getDoc(doc(db, "users", user.uid));
          if (!profile.exists() || profile.data().role !== "admin") {
            location.replace("journey.html");
            return;
          }
          await loadChildren();
          $("#status").textContent = "";
        } catch (error) {
          console.error("Unable to load admin dashboard", error);
          $("#status").textContent = t("admin.loadError");
        }
      });
    </script>
  </body>
</html>
