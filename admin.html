<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allen 的管理中心</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#eef7ff;margin:0;padding:28px;color:#24324a}.card{max-width:760px;margin:auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 30px #1f57972e}.child{margin:15px 0;padding:16px;border-radius:16px;background:#f3f7ff}button{padding:12px 18px;border:0;border-radius:12px;background:#4d86f7;color:#fff;font:inherit;font-weight:bold;cursor:pointer}.secondary{background:#e8effd;color:#274a85}</style><main class="card"><h1>Allen 的管理中心</h1><p id="status">正在读取家庭学习记录…</p><div id="children"></div><h2>游戏设置</h2><label><input id="sound" type="checkbox" checked> 开启答题音效</label><label><input id="easy" type="checkbox" checked> 使用简单难度</label><p><button id="save">保存设置</button></p><p><button id="logout" class="secondary">退出账户</button></p></main><script type="module">import{auth,db,onAuthStateChanged,signOut,doc,getDoc,getDocs,collection,setDoc}from"./js/firebase.js";const $=s=>document.querySelector(s);onAuthStateChanged(auth,async u=>{if(!u)return location.replace("index.html");const me=await getDoc(doc(db,"users",u.uid));if(!me.exists()||me.data().role!=="admin")return location.replace("journey.html");const people=await getDocs(collection(db,"users")),children=[];for(const p of people.docs){if(p.data().role!=="child")continue;const[d,g,a]=await Promise.all([getDoc(doc(db,"users",p.id,"dragon","current")),getDoc(doc(db,"users",p.id,"progress","summary")),getDocs(collection(db,"users",p.id,"attempts"))]);children.push({name:p.data().name,dragon:d.exists()?d.data():null,progress:g.exists()?g.data():null,attempts:a.size})}$("#status").textContent="孩子的学习记录";$("#children").innerHTML=children.map(c=>`<section class="child"><h2>${c.name}</h2><p>小龙：${c.dragon?(c.dragon.customName||c.dragon.speciesId)+" · "+c.dragon.profession:"尚未孵化"}</p><p>等级：中文 ${c.progress?.chineseLevel??"-"} · 英文 ${c.progress?.englishLevel??"-"} · 数学 ${c.progress?.mathLevel??"-"}</p><p>答题：${c.progress?.totalCorrect??0} / ${c.progress?.totalAnswered??0}，测试记录 ${c.attempts} 次</p></section>`).join("")||"尚无孩子记录"});$("#save").onclick=async()=>{await setDoc(doc(db,"gameSettings","current"),{soundEnabled:sound.checked,easyMode:easy.checked});alert("设置已保存")};$("#logout").onclick=()=>signOut(auth);</script></html>
