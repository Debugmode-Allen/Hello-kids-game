<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allen 的管理中心</title><style>body{font-family:"Microsoft YaHei";background:#eef7ff;padding:24px}.card{max-width:720px;margin:auto;background:#fff;padding:28px;border-radius:24px}.child{background:#f3f7ff;padding:16px;margin:14px 0;border-radius:14px}.dragon{background:#b45309}.history{background:#b42318}button{padding:9px;border:0;border-radius:9px;color:#fff;margin:3px}</style><main class="card"><h1>Allen 的管理中心</h1><div id="children">正在读取…</div><p><button id="logout">退出账户</button></p></main><script type="module">import{auth,db,onAuthStateChanged,signOut,doc,getDoc,getDocs,collection}from"./js/firebase.js";import{resetDragon,resetLearningHistory}from"./js/admin-dashboard.js";const box=document.querySelector("#children");onAuthStateChanged(auth,async u=>{if(!u)return location.replace("index.html");const me=await getDoc(doc(db,"users",u.uid));if(me.data().role!=="admin")return location.replace("journey.html");const people=await getDocs(collection(db,"users")),rows=[];for(const p of people.docs){if(p.data().role!=="child")continue;const[d,g,a]=await Promise.all([getDoc(doc(db,"users",p.id,"dragon","current")),getDoc(doc(db,"users",p.id,"progress","summary")),getDocs(collection(db,"users",p.id,"attempts"))]);rows.push({id:p.id,name:p.data().name,d:d.data(),g:g.data(),n:a.size})}box.innerHTML=rows.map(x=>`<section class="child"><h2>${x.name}</h2><p>小龙：${x.d?.customName||"尚未孵化"}</p><p>等级：中文 ${x.g?.chineseLevel??"-"} · 英文 ${x.g?.englishLevel??"-"} · 数学 ${x.g?.mathLevel??"-"}</p><p>历史测试：${x.n} 次</p><button class="dragon" data-id="${x.id}" data-name="${x.name}">重新孵化小龙</button><button class="history" data-id="${x.id}" data-name="${x.name}">清除学习与测试记录</button></section>`).join("");document.querySelectorAll(".dragon").forEach(b=>b.onclick=async()=>{if(confirm(`确认删除 ${b.dataset.name} 的小龙？下次登录需重新选蛋和测试。`)){await resetDragon(b.dataset.id);location.reload()}});document.querySelectorAll(".history").forEach(b=>b.onclick=async()=>{if(confirm(`确认清除 ${b.dataset.name} 的学习汇总和全部测试历史？小龙将保留。`)){await resetLearningHistory(b.dataset.id);location.reload()}})});document.querySelector("#logout").onclick=()=>signOut(auth);</script></html>
