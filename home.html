<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的小龙</title><style>body{font-family:"Microsoft YaHei";background:#eef7ff;padding:24px}.card{position:relative;max-width:620px;margin:auto;background:#fff;border-radius:24px;padding:40px 28px;text-align:center}.logout{position:absolute;right:14px;top:14px;background:#eef2f8;color:#52617a;font-size:12px}.dragon{max-height:250px;max-width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f7ff;padding:12px;border-radius:12px}button{padding:10px;border:0;border-radius:10px;background:#4d86f7;color:#fff}</style><main class="card"><button id="logout" class="logout">退出账户</button><h1 id="title">我的小龙</h1><img id="image" class="dragon"><h2 id="name"></h2><p id="job"></p><div class="stats"><div class="stat">等级<br><b id="level"></b></div><div class="stat">经验<br><b id="xp"></b></div><div class="stat">阶段<br><b id="stage"></b></div></div><h3>学习能力</h3><p id="learning"></p></main><script type="module">import{auth,db,onAuthStateChanged,signOut,doc,getDoc}from"./js/firebase.js";const $=x=>document.querySelector(x);onAuthStateChanged(auth,async u=>{if(!u)return location.replace("index.html");const d=await getDoc(doc(db,"users",u.uid,"dragon","current"));if(!d.exists())return location.replace("journey.html");const p=await getDoc(doc(db,"users",u.uid,"progress","summary")),x=d.data(),r=p.data();const lib=await fetch("assets/dragons/dragon-library.json").then(a=>a.json()),base=lib.find(a=>a.id===x.speciesId);$("#image").src=base.image;$("#name").textContent=x.customName||base.name;$("#job").textContent=x.profession;$("#level").textContent=x.level;$("#xp").textContent=x.xp;$("#stage").textContent=x.stage;$("#learning").textContent=`中文 ${r.chineseLevel} · 英文 ${r.englishLevel} · 数学 ${r.mathLevel}`});$("#logout").onclick=()=>signOut(auth);</script></html>
