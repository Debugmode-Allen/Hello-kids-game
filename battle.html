      .context-name { width: fit-content; max-width: 190px; padding: 8px 13px; border: 1px solid transparent; border-radius: 12px; background: transparent; box-shadow: none; color: #1e3a8a; font-size: 1rem; font-weight: 800; letter-spacing: .06em; text-shadow: 0 1px 2px rgba(255,255,255,.9); }

      .turn-icon img { width: 100%; height: 42px; object-fit: contain; }

      .turn-indicator[data-side="player"] { border-color: #f3ca71; background: #fff4cd; color: #713e07; }
      .slot { position: absolute; z-index: 1; width: var(--size); height: var(--size); transform: translate(-50%, -50%); transition: transform .16s, filter .16s; }
      .slot::after { position: absolute; bottom: 4%; left: 50%; z-index: 0; width: 100%; height: 18%; box-sizing: border-box; border-radius: 50%; content: ""; transform: translateX(-50%) skewX(-10deg); }
      .player-rear-1 { --size: 140px; top: 69%; left: 14%; } .player-rear-2 { --size: 72px; top: 38%; left: 25%; } .player-rear-3 { --size: 92px; top: 47%; left: 14%; }
      .player-front-1 { --size: 108px; top: 48%; left: 35%; } .player-front-2 { --size: 122px; top: 66%; left: 30%; }
      .enemy-rear-1 { --size: 140px; top: 69%; left: 86%; } .enemy-rear-2 { --size: 72px; top: 38%; left: 75%; } .enemy-rear-3 { --size: 92px; top: 47%; left: 86%; }
      .enemy-front-1 { --size: 108px; top: 48%; left: 65%; } .enemy-front-2 { --size: 122px; top: 66%; left: 70%; }
      .slot.empty { display: block; pointer-events: none; }
      .slot.empty::after { border: 1px dashed rgba(255,255,255,.54); background: rgba(255,255,255,.05); }
      .actor { z-index: 2; display: grid; place-items: center; background: transparent; }
      .actor.highlight { z-index: 4; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px #f59e0b) drop-shadow(0 0 12px #fde68a); }
      .actor::after { border: 2px solid rgba(254,240,138,.95); background: rgba(253,230,138,.12); opacity: 0; transition: opacity .16s; }
      .actor.highlight::after { opacity: 1; }
      .unit-button { touch-action: manipulation; }
      .actor.targetable { cursor: pointer; filter: drop-shadow(0 0 5px #fef08a); }
      .actor.targetable::after { border-color: #fef08a; background: rgba(254,240,138,.25); opacity: 1; }
      .actor:not(.enemy).targetable { filter: drop-shadow(0 0 6px #86efac); }
      .actor:not(.enemy).targetable::after { border-color: #86efac; background: rgba(134,239,172,.24); }
      .actor.protected { filter: brightness(.72) saturate(.7); }
      .actor.protected::before, .actor.ally-protected::before { position: absolute; top: 25%; left: 50%; z-index: 3; content: "🛡"; transform: translate(-50%, -50%); font-size: clamp(1rem, 2vw, 1.8rem); text-shadow: 0 1px 3px #fff; }

      .impact-mark { position: absolute; top: 18%; left: 5%; z-index: 9; width: 92%; height: 70%; object-fit: contain; pointer-events: none; animation: impact-flash .46s ease-out both; }
      .damage-number { position: absolute; top: 14%; left: 50%; z-index: 10; color: #fee2e2; font-family: Georgia, "Microsoft YaHei", sans-serif; font-size: clamp(1.3rem, 3.2vw, 2.3rem); font-weight: 900; line-height: 1; pointer-events: none; text-shadow: -2px -2px 0 #991b1b, 2px -2px 0 #991b1b, -2px 2px 0 #991b1b, 2px 2px 0 #991b1b, 0 3px 5px rgba(0,0,0,.5); animation: damage-pop 1.02s ease-out both; }
      @keyframes lunge-right { 0%,100% { transform: translate(-50%,-50%); } 28% { transform: translate(-50%,-50%) translateX(24px) rotate(-3deg); } 50% { transform: translate(-50%,-50%) translateX(48px) rotate(4deg) scale(1.07); } 70% { transform: translate(-50%,-50%) translateX(17px) rotate(-2deg); } }
      @keyframes lunge-left { 0%,100% { transform: translate(-50%,-50%); } 28% { transform: translate(-50%,-50%) translateX(-24px) rotate(3deg); } 50% { transform: translate(-50%,-50%) translateX(-48px) rotate(-4deg) scale(1.07); } 70% { transform: translate(-50%,-50%) translateX(-17px) rotate(2deg); } }
      @keyframes hit-shake { 0%,100% { transform: translate(-50%,-50%); } 18% { transform: translate(-50%,-50%) translateX(-8px) rotate(-4deg); } 36% { transform: translate(-50%,-50%) translateX(9px) rotate(4deg); } 55% { transform: translate(-50%,-50%) translateX(-6px) rotate(-2deg); } 75% { transform: translate(-50%,-50%) translateX(4px) rotate(1deg); } }
      @keyframes impact-flash { 0% { opacity: 0; transform: scale(.45) rotate(-18deg); } 35% { opacity: 1; transform: scale(1.08) rotate(-8deg); } 100% { opacity: 0; transform: scale(1.2) rotate(5deg); } }
      @keyframes damage-pop { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.45); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 70% { opacity: 1; transform: translate(-50%, -28px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -44px) scale(.9); } }
      .actor img { z-index: 1; width: 96%; height: 96%; object-fit: contain; }

      .health { position: absolute; top: -15px; left: 50%; z-index: 2; width: 92%; height: 15px; overflow: hidden; border: 2px solid #fff; border-radius: 99px; background: #1e293b; transform: translateX(-50%); box-shadow: 0 2px 5px rgba(15,23,42,.38); }

      .battle-intro, .battle-result { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; }

      .battle-intro-title { position: absolute; top: 50%; left: 50%; width: min(86%, 520px); margin: 0; padding: 20px 28px; border: 3px solid rgba(255,255,255,.85); border-radius: 22px; background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(254,242,242,.9)); color: #991b1b; font-size: clamp(2rem, 6vw, 4.2rem); letter-spacing: .12em; text-shadow: 0 2px 0 #fff; transform: translate(-50%,-50%) scale(1); box-shadow: 0 12px 30px rgba(127,29,29,.26); transition: top .68s ease-in, left .68s ease-in, transform .68s ease-in, opacity .55s ease-in; }

      .battle-result { z-index: 21; background: rgba(15,23,42,.66); backdrop-filter: blur(2px); color: #fff; }

      .result-card h2 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.7rem); }

      .adventure-progress { margin: 16px 0 8px; padding: 13px; border: 1px solid #fef3c7aa; border-radius: 16px; background: linear-gradient(135deg, #fff7d4, #f5d77a); color: #5d3a03; text-align: left; box-shadow: inset 0 1px #fff8; }

      .adventure-xp-track { height: 13px; margin-top: 8px; overflow: hidden; border: 2px solid #9d6714; border-radius: 99px; background: #6c4315; box-shadow: inset 0 1px 2px #0005; }
      .adventure-xp-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #73d6ff, #e9fcff 58%, #fff59c); box-shadow: 0 0 12px #fff; transition: width 1.25s cubic-bezier(.16,.82,.23,1); }
      .adventure-xp-gain { margin: 8px 0 0; color: #8b4d00; font: 900 1rem/1 "Microsoft YaHei", sans-serif; text-align: center; }

      .level-up-panel strong { display: block; font-size: 1.34rem; }.level-up-panel span { display: block; margin-top: 5px; font: 800 .78rem/1.35 "Microsoft YaHei", sans-serif; }

      button:hover { filter: brightness(1.1); transform: translateY(-2px); } button:focus-visible { outline: 3px solid #fef08a; outline-offset: 2px; }
      .notice { min-height: 1.5em; margin: 12px 0 0; color: #334155; text-align: center; }
      @media (max-width: 760px) {
        body { padding: 64px 6px 16px; } .battlefield { min-height: 520px; border-width: 4px; }
        .battle-energy-dock { top: 14%; left: 4%; width: 72px; height: 72px; } .battle-energy-dock .energy-meter { --energy-meter-size: 72px; }
        .battle-charge .quiz-card { transform: translateY(clamp(24px, 6vh, 44px)); }

        .queue-wrap { grid-column: 1 / -1; grid-row: 2; }

        .player-rear-1 { --size: 104px; top: 70%; left: 14%; } .player-rear-2 { --size: 54px; top: 41%; left: 25%; } .player-rear-3 { --size: 68px; top: 49%; left: 14%; }

  <body>
    <main class="battle-page">
      <section class="battlefield" aria-label="battlefield">
        <div id="battleIntro" class="battle-intro hidden" aria-live="polite"><h1 id="battleIntroTitle" class="battle-intro-title"></h1></div>
        <div id="battleCharge" class="battle-charge" hidden>
          <section class="quiz-card">
            <p id="chargeProgress"></p>
            <h2 id="chargeQuestion" tabindex="-1"></h2>
            <div id="chargeOptions" class="quiz-options"></div>
            <p id="chargeFeedback" class="charge-feedback" role="status"></p>
            <div class="charge-actions">
              <button id="chargeSubmit" class="charge-submit-ring" type="button" disabled>
                <span id="chargeEnergyMeter" class="energy-meter charge-energy-meter"></span>
                <span id="chargeSubmitLabel" class="charge-submit-ring__label"></span>
              </button>
              <button id="chargeSkip" class="quiz-secondary" type="button"></button>
              <button id="chargeBeginBattle" class="quiz-secondary" type="button"></button>

            </div>
          </section>
        </div>
        <div id="battleEnergyDock" class="battle-energy-dock" hidden aria-label=""></div>
        <div id="battleResult" class="battle-result hidden" aria-live="polite">
          <section class="result-card">
            <h2 id="resultTitle"></h2><p id="resultSummary"></p><p id="resultReturning"></p>
            <section id="adventureProgress" class="adventure-progress" hidden>
              <div class="adventure-progress__top"><strong id="adventureLevel"></strong><span id="adventureXpText"></span></div>
              <div class="adventure-xp-track"><div id="adventureXpFill" class="adventure-xp-fill"></div></div>
              <p id="adventureXpGain" class="adventure-xp-gain"></p>
            </section>
            <section id="levelUpPanel" class="level-up-panel" hidden><strong id="levelUpTitle"></strong><span id="levelUpStats"></span></section>
            <div id="resultActions" class="result-actions" hidden>
              <a id="replayMatch" href="battle.html?from=practice"></a>
              <a id="backToArenas" href="practice-battles.html"></a>
            </div>
          </section>
        </div>
        <div class="battle-context">
          <span id="sceneName" class="context-name"></span>
          <div class="queue-wrap">
            <div id="turnQueue" class="turn-queue"></div>

        <!-- 后排三格：L1-L3 / R1-R3；前排两格：L4-L5 / R4-R5。 -->
        <div class="slot player-rear-1" data-slot="L3"></div><div class="slot player-rear-2" data-slot="L1"></div><div class="slot player-rear-3" data-slot="L2"></div>

        <div class="slot enemy-rear-3" data-slot="R2"></div>

        <div class="slot enemy-front-2" data-slot="R5"></div>

          <button id="claw" class="round-action" type="button"><img src="assets/battle/actions/claw-swipe.png" alt="" /></button>

          <span class="round-action skill-locked" aria-hidden="true"></span>
          <span class="round-action skill-locked" aria-hidden="true"></span>

        </div>

      <button id="returnHome" type="button"></button>

    <script type="module">
      import { auth, db, onAuthStateChanged, doc, getDoc, runTransaction } from "./js/firebase.js";
      import { effectiveStamina, loadCheckins } from "./js/checkin-client.js?v=20261117-spark";
      import { loadUI, t } from "./js/i18n.js";
      import { createDoubleClick } from "./js/double-click.js";
      import { createSkillEffects, NEW_SKILL_EFFECTS } from "./js/battle-skill-effects.js";
      import { canQuickClaw } from "./js/battle-input.js";
      import { deployedCompanions } from "./js/companions.js";
      import { addDragonXp, progressForDragon } from "./js/dragon-progression.js";
      import { beginNextTurn, calculateDamage, consumeControlledTurn, createBattle, fleeBattle, isProtected, remainingSkillCharges, selectEnemyTarget, skipTurn, unitById, upcomingTurns, useDamageSkill, useSkill, validTargets } from "./js/battle-engine.js?v=seven-dragon-skills";
      import { createChargeQuestions } from "./js/assessment.js";
      import { renderQuestionOptions } from "./js/question-options.js?v=confirm-choice";
      import { beginAnswerCrystal, consumeSkillEnergyPreview, dismissAnswerCrystal, renderEnergyMeter, showSkillEnergyPreview, transferEnergyMeter } from "./js/energy-meter.js?v=answer-crystal-20261118";
      import { playCue } from "./js/audio-manager.js";

      const $ = (selector) => document.querySelector(selector);
      const query = new URLSearchParams(location.search);
      const fromPractice = query.get("from") === "practice";
      const fromAdventure = query.get("from") === "adventure";
      const adventureRun = query.get("run");
      const adventureNode = query.get("node");
      const adventureRewardXp = Math.max(0, Math.floor(Number(query.get("xp")) || 0));
      const requestedBattleId = query.get("battle") || "practice-meadow";
      import { mergeCompanionProfiles } from "./js/companion-rewards.js";
      function localAdventureProfile(userId) {
        try { return JSON.parse(localStorage.getItem(`dragon-adventure-profile:${userId}`)) || null; }
        catch { return null; }
      }
      const slots = new Map([...document.querySelectorAll("[data-slot]")].map((element) => [element.dataset.slot, element]));
      let state = null;
      function returnPageForResult() {
        if (fromAdventure) {
          const dragon = state ? unitById(state, "dragon") : null;
          const encounter = state?.status === "victory" && adventureNode ? `&node=${encodeURIComponent(adventureNode)}&result=victory` : "";
          const health = dragon ? `&battleStatus=${encodeURIComponent(state.status)}&hp=${encodeURIComponent(dragon.hp)}&maxHp=${encodeURIComponent(dragon.maxHp)}` : "";
          return `chapter.html?chapter=${encodeURIComponent(adventureRun || "meadow-1")}${encounter}${health}`;
        }
        return fromPractice ? "practice-battles.html" : "home.html";
      }
      let targeting = null;
      let skillOne = null;
      let busy = true;
      let completedTurns = 0;
      let impactImagePath = "";
      let activeDragonRef = null;
      let adventureDragon = null;
      let adventureProgression = null;
      const spellTextures = new Map();
      const skillEffects = createSkillEffects({ field: $(".battlefield"), slots, textures: spellTextures });

      async function loadJson(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      }

      function setNotice(key, values = {}) { $("#notice").textContent = t(key, values); }

      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      function clampEnergy(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? Math.max(0, Math.min(10, Math.floor(parsed))) : 0;
      }

      async function changeStoredEnergy(delta) {
        return runTransaction(db, async (transaction) => {
          const snapshot = await transaction.get(activeDragonRef);
          if (!snapshot.exists()) throw new Error("Missing dragon record");
          const data = snapshot.data();
          const current = clampEnergy(data.energy);
          const next = Math.max(0, Math.min(10, current + delta));
          if (delta < 0 && current < -delta) throw new Error("Not enough stored energy");
          if (data.energy !== current || next !== current) transaction.set(activeDragonRef, { energy: next }, { merge: true });
          return next;
        });
      }

      function updateEnergyDisplay(currentEnergy, previousEnergy, chargeFromCenter = false) {
        renderEnergyMeter($("#chargeEnergyMeter"), {
          currentEnergy,
          previousEnergy,
          capacity: 10,
          chargeFromCenter,
          label: (current, capacity) => t("charge.energyMeterLabel", { current, capacity })
        });
      }

      async function persistSkillSpend(skillId, sourceElement = null) {
        const cost = Math.max(1, Math.floor(Number(state.skills[skillId]?.energyCost) || 1));
        const previousEnergy = remainingSkillCharges(state);
        const currentEnergy = await changeStoredEnergy(-cost);
        state.skillCharges.earned = currentEnergy + state.skillCharges.spent + cost;
        const preview = sourceElement ? consumeSkillEnergyPreview(sourceElement) : Promise.resolve();
        updateEnergyDisplay(currentEnergy, previousEnergy);
        playCue("energy-spend");
        await preview;
        return cost;
      }

      async function showBattleIntro(battleName, progress) {
        const intro = $("#battleIntro");
        $("#battleIntroTitle").textContent = battleName;
        intro.classList.remove("hidden", "leaving");
        playCue("battle-start");
        await wait(850);
        intro.classList.add("leaving");
        await wait(700);
        intro.classList.add("hidden");
        await runChargeQuiz(createChargeQuestions(progress));
        await runEnemyTurns();
      }

      async function runChargeQuiz(questions) {
        const panel = $("#battleCharge");
        const submit = $("#chargeSubmit");
        const skip = $("#chargeSkip");
        const beginBattle = $("#chargeBeginBattle");
        const next = $("#chargeNext");
        let correctCount = 0;
        $("#chargeSubmitLabel").textContent = t("charge.submit");
        submit.setAttribute("aria-label", t("charge.submit"));
        skip.textContent = t("charge.skipQuestion");
        beginBattle.textContent = t("charge.beginBattleDirect");
        panel.hidden = false;
        const energyMeter = $("#chargeEnergyMeter");
        updateEnergyDisplay(state.skillCharges.earned, state.skillCharges.earned);

        for (const [index, question] of questions.entries()) {
          const last = index === questions.length - 1;
          $("#chargeProgress").textContent = t("assessment.progress", {
            current: index + 1, total: questions.length, subject: question.subject, grade: question.grade
          });
          $("#chargeQuestion").textContent = question.question;
          $("#chargeFeedback").textContent = "";
          $("#chargeSubmitLabel").hidden = false;
          const actions = $(".charge-actions");
          actions.hidden = false;
          actions.classList.remove("is-resolved");
          submit.disabled = true;
          skip.disabled = false;
          beginBattle.disabled = false;
          skip.hidden = false;
          beginBattle.hidden = false;
          next.hidden = true;
          $("#chargeQuestion").focus();
          const action = await new Promise((resolve) => {
            let selectedAnswer;
            const controller = new AbortController();
            const options = renderQuestionOptions($("#chargeOptions"), question, (choice) => {
              selectedAnswer = choice;
              submit.disabled = false;
            });
            const finish = (result) => {
              controller.abort();
              resolve(result);
            };
            submit.addEventListener("click", async () => {
              if (!selectedAnswer) return;
              submit.disabled = true;
              $("#chargeSubmitLabel").hidden = true;
              const answerCrystal = beginAnswerCrystal(energyMeter);
              const correct = selectedAnswer === question.answer;
              playCue(correct ? "answer-correct" : "answer-wrong");
              correctCount += Number(correct);
              for (const option of options) option.disabled = true;
              skip.disabled = true;
              beginBattle.disabled = true;
              let energyFull = false;
              let energySaveFailed = false;
              if (correct && skillOne) {
                const previousEnergy = remainingSkillCharges(state);
                try {
                  const currentEnergy = await changeStoredEnergy(1);
                  state.skillCharges.earned = currentEnergy + state.skillCharges.spent;
                  energyFull = currentEnergy === previousEnergy;
                  if (!energyFull) {
                    updateEnergyDisplay(currentEnergy, previousEnergy, true);
                    await wait(540);
                  }
                } catch (error) {
                  console.error("Unable to save dragon energy", error);
                  energySaveFailed = true;
                }
              }
              if (!correct) dismissAnswerCrystal(answerCrystal, true);
              else if (energyFull || energySaveFailed || !skillOne) dismissAnswerCrystal(answerCrystal);
              actions.classList.add("is-resolved");
              skip.hidden = true;
              beginBattle.hidden = false;
              beginBattle.disabled = false;
              renderSkillCharges();
              const feedback = energySaveFailed
                ? t("charge.saveError")
                : energyFull && correct
                  ? t("charge.full")
                  : correct && skillOne
                    ? t("charge.correct")
                    : t(correct ? "charge.correctNoEnergy" : "charge.incorrect", { answer: question.answer });
              $("#chargeFeedback").textContent = t(last && skillOne ? "charge.result" : "charge.feedback", {
                feedback,
                count: correctCount,
                total: questions.length,
                charges: remainingSkillCharges(state)
              });
              next.textContent = t(last ? "charge.beginBattle" : "journey.next");
              next.hidden = false;
              next.addEventListener("click", () => finish({ type: "next" }), { once: true });
              next.focus();
            }, { once: true, signal: controller.signal });
            skip.addEventListener("click", () => {
              $("#chargeFeedback").textContent = t("charge.skipped");
              finish({ type: "next" });
            }, { once: true, signal: controller.signal });
            beginBattle.addEventListener("click", () => finish({ type: "battle" }), { once: true, signal: controller.signal });
          });
          if (action.type === "battle") break;
        }
        const dock = $("#battleEnergyDock");
        dock.hidden = false;
        await transferEnergyMeter(energyMeter, dock);
        panel.hidden = true;
      }

      function renderSkillCharges() {
        if (!skillOne) return;
        const { earned, spent } = state.skillCharges;
        const description = t(skillOne.descriptionKey || `${skillOne.nameKey}Description`, {
          turns: skillOne.durationTurns, delay: skillOne.delayTurns
        });
        const counts = t("charge.counts", { remaining: remainingSkillCharges(state), spent, empty: 10 - remainingSkillCharges(state) });
        const button = $("#skillOne");
        button.title = `${t(skillOne.nameKey)}：${description} ${counts}`;
        button.setAttribute("aria-label", button.title);
      }

      function showBattleResult() {
        const result = $("#battleResult");
        const titleKey = state.status === "victory" ? "battle.resultVictoryTitle"
          : state.status === "defeat" ? "battle.resultDefeatTitle"
            : "battle.resultFledTitle";
        const summaryKey = state.status === "victory" ? "battle.resultVictorySummary"
          : state.status === "defeat" ? "battle.resultDefeatSummary"
            : "battle.resultFledSummary";
        $("#resultTitle").textContent = t(titleKey);
        $("#resultSummary").textContent = t(summaryKey);
        if (fromPractice) {
          const dragon = unitById(state, "dragon");
          $("#resultReturning").textContent = t("practice.matchStats", {
            turns: completedTurns, hp: dragon.hp, max: dragon.maxHp
          });
          $("#replayMatch").textContent = t("practice.replay");
          $("#backToArenas").textContent = t("practice.backToArenas");
          $("#resultActions").hidden = false;
        } else if (fromAdventure) {
          if (state.status === "victory") {
            $("#resultSummary").textContent = t("chapter.battleVictorySummary");
            showAdventureProgression();
          } else if (state.status === "fled") {
            $("#resultTitle").textContent = t("chapter.battleFledTitle");
            $("#resultSummary").textContent = t("chapter.battleFledSummary");
          }
          $("#resultReturning").textContent = state.status === "victory" ? t("chapter.returnAfterVictory")
            : state.status === "fled" ? t("chapter.returnAfterFlee") : t("chapter.moveHint");
          $("#replayMatch").hidden = true;
          $("#backToArenas").href = returnPageForResult();
          $("#backToArenas").textContent = t("chapter.returnMap");
          $("#resultActions").hidden = false;
        } else {
          $("#resultReturning").textContent = t("battle.resultReturning");
          setTimeout(() => location.assign(returnPageForResult()), 3000);
        }
        result.classList.remove("hidden");
        playCue(state.status === "victory" ? "battle-win" : state.status === "defeat" ? "battle-lose" : "battle-flee");
      }

      function showAdventureProgression() {
        if (!adventureDragon || !adventureProgression) return;
        const before = progressForDragon(adventureDragon, adventureProgression);
        const after = addDragonXp(adventureDragon, adventureRewardXp, adventureProgression);
        const progress = $("#adventureProgress");
        progress.hidden = false;
        $("#adventureLevel").textContent = t("chapter.resultLevel", { level: after.level });
        $("#adventureXpText").textContent = after.isMaxLevel ? t("chapter.resultMaxLevel") : t("chapter.resultXp", { current: after.xpIntoLevel, need: after.xpForNextLevel });
        $("#adventureXpGain").textContent = t("chapter.resultXpGain", { value: adventureRewardXp });
        const fill = $("#adventureXpFill");
        const beforeWidth = before.isMaxLevel ? 100 : before.xpIntoLevel / before.xpForNextLevel * 100;
        const afterWidth = after.isMaxLevel ? 100 : after.xpIntoLevel / after.xpForNextLevel * 100;
        fill.style.transition = "none"; fill.style.width = `${beforeWidth}%`;
        if (after.levelsGained > 0) {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            fill.style.transition = ""; fill.style.width = "100%";
            setTimeout(() => { fill.style.transition = "none"; fill.style.width = "0%"; requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = ""; fill.style.width = `${afterWidth}%`; })); }, 700);
          }));
        } else {
          requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = ""; fill.style.width = `${afterWidth}%`; }));
        }
        if (after.levelsGained > 0) {
          const panel = $("#levelUpPanel");
          setTimeout(() => {
            $("#levelUpTitle").textContent = t("chapter.levelUp", { level: after.level });
            $("#levelUpStats").textContent = t("chapter.levelUpStats", { levels: after.levelsGained, attack: after.levelsGained * 2, defense: after.levelsGained * 2, speed: after.levelsGained * 2, stamina: after.levelsGained * 20 });
            panel.hidden = false;
          }, 1450);
        }
      }

      async function playAttackAnimation(attacker, target, damage) {
        const attackerSlot = slots.get(attacker.slot);
        const targetSlot = slots.get(target.slot);
        if (!attackerSlot || !targetSlot) return;
        attackerSlot.classList.add(attacker.side === "player" ? "attack-right" : "attack-left");
        playCue("claw-windup");
        await wait(270);
        if (attacker.darknessTurns > 0) {
          const miss = document.createElement("strong");
          miss.className = "damage-number miss-label";
          miss.textContent = t("battle.miss");
          targetSlot.append(miss);
          await wait(980);
          miss.remove();
          attackerSlot.classList.remove("attack-right", "attack-left");
          return;
        }
        targetSlot.classList.add("hit-shake");
        playCue(attacker.side === "player" ? "claw-hit" : "enemy-hit");
        const impact = document.createElement("img");
        impact.className = "impact-mark";
        impact.src = impactImagePath;
        impact.alt = "";
        const damageNumber = document.createElement("strong");
        damageNumber.className = "damage-number";
        const shieldDamage = Math.min(target.shieldHp || 0, damage);
        const hpDamage = Math.min(target.hp, Math.max(0, damage - shieldDamage));
        damageNumber.textContent = shieldDamage
          ? hpDamage ? `-${hpDamage} 🛡-${shieldDamage}` : `🛡-${shieldDamage}`
          : `-${damage}`;
        targetSlot.append(impact, damageNumber);
        await wait(980);
        impact.remove();
        damageNumber.remove();
        attackerSlot.classList.remove("attack-right", "attack-left");
        targetSlot.classList.remove("hit-shake");
      }

      function spellEffect(className, skillId, container) {
        const effect = document.createElement("span");
        effect.className = className;
        const texture = spellTextures.get(skillId);
        effect.style.setProperty("--spell-texture", texture ? `url("${texture}")` : "none");
        effect.dataset.skillId = skillId;
        effect.setAttribute("aria-hidden", "true");
        container.append(effect);
        return effect;
      }

      async function playVineAnimation(target, damage) {
        const targetSlot = slots.get(target.slot);
        playCue("vine-cast");
        const vines = spellEffect("vine-wrap", "entangling-vines", targetSlot);
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        await wait(reducedMotion ? 0 : 340);
        targetSlot.classList.add("hit-shake", "spell-shake");
        playCue("vine-bind");
        const number = document.createElement("strong");
        number.className = "damage-number";
        number.textContent = `-${damage}`;
        targetSlot.append(number);
        const leaves = document.createElement("span");
        leaves.className = "vine-leaves";
        leaves.setAttribute("aria-hidden", "true");
        targetSlot.append(leaves);
        await wait(reducedMotion ? 620 : 1000);
        vines.remove();
        leaves.remove();
        number.remove();
        targetSlot.classList.remove("hit-shake", "spell-shake");
      }

      async function playSpellAnimation(attacker, target, skillId, damage) {
        const field = $(".battlefield");
        const fieldRect = field.getBoundingClientRect();
        const sprite = slots.get(attacker.slot).querySelector(".unit-button img").getBoundingClientRect();
        const targetSlot = slots.get(target.slot);
        const destination = targetSlot.getBoundingClientRect();
        const fire = skillId === "fire-breath";
        const dark = skillId === "dark-magic";
        if (fire) playCue("fire-breath-cast");
        const originX = sprite.left + sprite.width * (fire ? .73 : .78);
        const originY = sprite.top + sprite.height * (fire ? .34 : .48);
        const dx = destination.left + destination.width * .5 - originX;
        const dy = destination.top + destination.height * .52 - originY;
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

        let plume;
        if (!reducedMotion) {
          plume = spellEffect(fire ? "fire-stream" : "spell-flight", skillId, field);
          plume.style.left = `${originX - fieldRect.left - field.clientLeft}px`;
          plume.style.top = `${originY - fieldRect.top - field.clientTop}px`;
          if (fire) {
            plume.style.width = `${Math.hypot(dx, dy) + destination.width * .23}px`;
            plume.style.height = `${destination.height * .85}px`;
            plume.style.rotate = `${Math.atan2(dy, dx)}rad`;
            await wait(240);
          } else {
            const flight = plume.animate([
              { transform: "translate(-50%, -50%) scale(.48)", opacity: .3 },
              { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.25)`, opacity: .88 }
            ], { duration: 510, easing: "ease-out", fill: "forwards" });
            await flight.finished;
            plume.remove();
          }
        }

        const impact = spellEffect(fire ? "flame-burn" : "spell-arrival", skillId, targetSlot);
        if (fire) playCue("fire-breath-hit");
        else if (dark) playCue("moon-darkness-apply");
        if (fire) {
          targetSlot.classList.add("hit-shake", "spell-shake");
          const number = document.createElement("strong");
          number.className = "damage-number";
          number.textContent = `-${damage}`;
          targetSlot.append(number);
          await wait(reducedMotion ? 650 : 1060);
          plume?.remove();
          number.remove();
          targetSlot.classList.remove("hit-shake", "spell-shake");
        } else {
          await wait(reducedMotion ? 160 : 440);
        }
        impact.remove();
      }

      async function playSkillResult(result) {
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (result.skill.id === "dark-magic") playCue("moon-darkness-cast");
        if (result.hits?.length) {
          for (const [hitIndex, hit] of result.hits.entries()) {
            if (result.skill.id === "entangling-vines") await playVineAnimation(hit.target, hit.hpDamage);
            else if (["piercing-sand", "star-chain"].includes(result.skill.id)) {
              const origin = result.skill.id === "star-chain" && hitIndex > 0 ? result.hits[hitIndex - 1].target : result.attacker;
              await skillEffects.hit(origin, hit.target, result.skill.id, hitIndex);
            } else await playSpellAnimation(result.attacker, hit.target, result.skill.id, hit.hpDamage);
            if (hit.hpDamage && !["fire-breath", "entangling-vines"].includes(result.skill.id)) {
              showFloatingLabel(hit.target, `-${hit.hpDamage}`, "skill-damage");
            }
            if (hit.shieldDamage) showFloatingLabel(hit.target, `🛡 -${hit.shieldDamage}`, "shield-number");
          }
        }
        if (result.applied?.length) {
          await Promise.all(result.applied.map(async (effect) => {
            if (effect.healed) showFloatingLabel(effect.target, `+${effect.healed}`, "heal-number");
            if (effect.shieldHp) showFloatingLabel(effect.target, `🛡 ${effect.shieldHp}`, "shield-number");
            if (NEW_SKILL_EFFECTS.has(result.skill.id)) await skillEffects.support(effect.target, result.skill.id);
            else {
              const overlay = spellEffect("support-arrival", result.skill.id, slots.get(effect.target.slot));
              try { await wait(reducedMotion ? 90 : 410); } finally { overlay.remove(); }
            }
          }));
        }
      }

      function showFloatingLabel(unit, text, className) {
        const slot = slots.get(unit.slot);
        if (!slot) return;
        const label = document.createElement("strong");
        label.className = `damage-number ${className}`;
        label.textContent = text;
        slot.append(label);
        setTimeout(() => label.remove(), 1150);
      }

      function currentUnit() { return unitById(state, state?.activeUnitId); }

      function isPlayerTurn() {
        return state?.status === "playing" && currentUnit()?.side === "player";
      }

      function setHighlight(unitId, active) {
        const unit = unitById(state, unitId);
        slots.get(unit?.slot)?.classList.toggle("highlight", active);
        document.querySelectorAll(`[data-queue-unit="${unitId}"]`).forEach((item) => item.classList.toggle("highlight", active));
      }

      function renderQueue() {
        const queue = $("#turnQueue");
        queue.replaceChildren();
        const preview = state.status === "playing" ? upcomingTurns(state) : [];
        preview.forEach((unitId) => {
          const unit = unitById(state, unitId);
          const icon = document.createElement("button");
          icon.type = "button";
          icon.className = "turn-icon";
          icon.dataset.queueUnit = unitId;
          const image = document.createElement("img");
          image.src = unit.image;
          if (unit.facing === "right" && unit.slot.startsWith("R")) image.style.transform = "scaleX(-1)";
          image.alt = unit.name;
          const caption = document.createElement("span");
          caption.textContent = unit.name;
          icon.append(image, caption);
          icon.addEventListener("mouseenter", () => setHighlight(unitId, true));
          icon.addEventListener("mouseleave", () => setHighlight(unitId, false));
          icon.addEventListener("focus", () => setHighlight(unitId, true));
          icon.addEventListener("blur", () => setHighlight(unitId, false));
          queue.append(icon);
        });
      }

      function renderTurnIndicator() {
        const active = currentUnit();
        const indicator = $("#turnIndicator");
        indicator.hidden = !active;
        if (!active) return;
        indicator.dataset.side = active.side;
        indicator.textContent = t(active.side === "player" ? "battle.queuePlayerTurn" : "battle.queueEnemyTurn", { name: active.name });
        $("#turnQueue").firstElementChild?.setAttribute("aria-current", "true");
      }

      async function advanceTurnQueue() {
        const queue = $("#turnQueue");
        const [finished, ...following] = queue.children;
        if (!finished || matchMedia("(prefers-reduced-motion: reduce)").matches) {
          renderQueue();
          renderTurnIndicator();
          return;
        }

        const previousPositions = new Map();
        for (const icon of following) {
          const id = icon.dataset.queueUnit;
          const positions = previousPositions.get(id) ?? [];
          positions.push(icon.getBoundingClientRect().left);
          previousPositions.set(id, positions);
        }
        await finished.animate([
          { transform: "translateY(0)", opacity: 1 },
          { transform: "translateY(20px) scale(.88)", opacity: 0 }
        ], { duration: 205, easing: "ease-in", fill: "forwards" }).finished;

        renderQueue();
        const shifts = [...queue.children].map((icon) => {
          const previous = previousPositions.get(icon.dataset.queueUnit)?.shift();
          if (previous === undefined) {
            return icon.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 }).finished;
          }
          const offset = previous - icon.getBoundingClientRect().left;
          return icon.animate([
            { transform: `translateX(${offset}px)` }, { transform: "translateX(0)" }
          ], { duration: 220, easing: "ease-out" }).finished;
        });
        await Promise.all(shifts);
        renderTurnIndicator();
      }

      // Defer enemy single clicks so a selected spell cannot fire on the first half of a double click.
      let clickContext = null;
      const enemyClicks = createDoubleClick((id) => {
        if (!clickContext || clickContext.actor !== state?.activeUnitId || clickContext.turn !== completedTurns
            || clickContext.skill !== targeting || busy || !isPlayerTurn()) return;
        const unit = unitById(state, id);
        if (unit?.alive) onUnitClick(unit);
      }, (id) => {
        if (!clickContext || clickContext.actor !== state?.activeUnitId || clickContext.turn !== completedTurns) return;
        if (!canQuickClaw(state, id, busy)) {
          if (!busy && isPlayerTurn() && isProtected(state, unitById(state, id))) setNotice("battle.protected");
          return;
        }
        targeting = "claw";
        showSkillEnergyPreview($("#skillOne"), false);
        onUnitClick(unitById(state, id));
      });
      function handleUnitClick(unit, event) {
        if (unit.side !== "enemy") { enemyClicks.clear(); onUnitClick(unit); return; }
        if (busy || !isPlayerTurn()) { enemyClicks.clear(); return; }
        const context = { actor: state.activeUnitId, turn: completedTurns, skill: targeting };
        if (clickContext && (clickContext.actor !== context.actor || clickContext.turn !== context.turn || clickContext.skill !== context.skill)) enemyClicks.clear();
        clickContext = context;
        // Keyboard activation retains immediate single-click skill targeting.
        if (event.detail === 0 && !event.pointerType) { enemyClicks.clear(); onUnitClick(unit); return; }
        enemyClicks.click(unit.id);
      }

      function renderUnits() {
        const validIds = targeting && isPlayerTurn()
          ? new Set(validTargets(state, currentUnit().id, targeting).map((unit) => unit.id))
          : new Set();
        slots.forEach((slot, slotId) => {
          const unit = state.units.find((candidate) => candidate.slot === slotId && candidate.alive);
          slot.replaceChildren();
          slot.classList.remove("actor", "enemy", "targetable", "protected", "ally-protected", "highlight");
          if (!unit) { slot.classList.add("empty"); return; }
          slot.classList.remove("empty");
          slot.classList.add("actor");
          if (unit.side === "enemy") slot.classList.add("enemy");
          const canTarget = validIds.has(unit.id);
          const protectedTarget = targeting && state.skills[targeting].obeysFrontlineProtection && unit.side === "enemy" && isProtected(state, unit);
          slot.classList.toggle("targetable", canTarget);
          slot.classList.toggle("protected", protectedTarget);
          slot.classList.toggle("ally-protected", unit.side === "player" && isProtected(state, unit));
          const button = document.createElement("button");
          button.type = "button";
          button.className = "unit-button";
          const status = unit.darknessTurns > 0
            ? t("battle.darkMagicRemaining", { turns: unit.darknessTurns }) : "";
          button.setAttribute("aria-label", status ? `${unit.name}?${status}` : unit.name);
          if (status) button.title = status;
          const image = document.createElement("img");
          image.src = unit.image;
          image.alt = "";
          const health = document.createElement("span");
          health.className = "health";
          const healthFill = document.createElement("span");
          healthFill.className = "health-fill";
          healthFill.style.width = `${Math.max(0, unit.hp / unit.maxHp * 100)}%`;
          health.append(healthFill);
          const hpReadout = document.createElement("strong");
          hpReadout.className = "hp-readout";
          hpReadout.textContent = t("battle.hpValue", { current: unit.hp, max: unit.maxHp });
          button.append(image, health, hpReadout);
          const statuses = [];
          if (unit.controlTurns > 0) statuses.push(["❄️", t("battle.controlBadge")]);
          if (unit.attackBuffTurns > 0) statuses.push(["⬆️", t("battle.attackBoostBadge")]);
          if (unit.defenseBuffTurns > 0) statuses.push(["🛡️", t("battle.defenseBoostBadge")]);
          if (unit.healOverTimeTurns > 0) statuses.push(["🌸", t("battle.regenerationBadge")]);
          if (unit.shieldHp > 0) statuses.push(["🔰", t("battle.shieldBadge", { amount: unit.shieldHp })]);
          if (statuses.length) {
            const statusRow = document.createElement("span");
            statusRow.className = "unit-statuses";
            for (const [glyph, label] of statuses) {
              const badge = document.createElement("span");
              badge.className = "unit-status";
              badge.textContent = glyph;
              badge.title = label;
              badge.setAttribute("aria-label", label);
              statusRow.append(badge);
            }
            button.append(statusRow);
            button.setAttribute("aria-label", `${unit.name}，${statuses.map(([, label]) => label).join("，")}`);
          }
          button.addEventListener("mouseenter", () => setHighlight(unit.id, true));
          button.addEventListener("mouseleave", () => setHighlight(unit.id, false));
          button.addEventListener("click", (event) => handleUnitClick(unit, event));
          if (unit.side === "enemy") button.title = t("battle.quickClawHint");
          slot.append(button);
          skillEffects.status(unit);
          if (status) {
            image.classList.add("darkened-sprite");
            const badge = document.createElement("span");
            badge.className = "darkness-turns";
            badge.setAttribute("aria-hidden", "true");
            badge.textContent = t("battle.darkMagicBadge", { turns: unit.darknessTurns });
            button.append(badge);
            spellEffect("darkness-aura", "dark-magic", slot);
          }
        });
      }

      function renderControls() {
        const playerTurn = isPlayerTurn();
        const dragonTurn = currentUnit()?.id === "dragon";
        $("#claw").disabled = !playerTurn || busy;
        $("#skip").disabled = !playerTurn || busy;
        const skillCost = skillOne ? Math.max(1, Math.floor(Number(skillOne.energyCost) || 1)) : 1;
        $("#skillOne").disabled = !skillOne || !playerTurn || !dragonTurn || busy || remainingSkillCharges(state) < skillCost;
        if ((!skillOne || !playerTurn || !dragonTurn || busy || remainingSkillCharges(state) < skillCost)
          && targeting !== skillOne?.id) {
          showSkillEnergyPreview($("#skillOne"), false);
        }
        $("#flee").disabled = state?.status !== "playing" || busy;
        $("#returnHome").classList.remove("visible");
      }

      function render({ updateQueue = true } = {}) {
        if (!state) return;
        renderUnits();
        if (updateQueue) {
          renderQueue();
          renderTurnIndicator();
        }
        renderControls();
        renderSkillCharges();
      }

      async function finishDisplayedTurn() {
        enemyClicks.clear();
        completedTurns += 1;
        render({ updateQueue: false });
        await advanceTurnQueue();
        if (state.status !== "playing") showBattleResult();
      }

      async function runEnemyTurns() {
        busy = true;
        while (state.status === "playing") {
          const active = beginNextTurn(state);
          if (!active) return;
          renderTurnIndicator();
          if (active.side === "player") {
            busy = false;
            setNotice("battle.playerTurn", { name: active.name });
            render();
            return;
          }
          if (active.controlTurns > 0) {
            consumeControlledTurn(state, active.id);
            setNotice("battle.controlSkipped", { name: active.name });
            await skillEffects.support(active, "crystal-freeze");
            await finishDisplayedTurn();
            if (state.status !== "playing") showBattleResult();
            continue;
          }
          const target = selectEnemyTarget(state, active.id, active.skillId);
          if (!target) return;
          const roll = Math.random();
          const damage = calculateDamage(state, active, target, active.skillId, () => roll);
          await playAttackAnimation(active, target, damage);
          const result = useDamageSkill(state, active.id, target.id, active.skillId, () => roll);
          if (result.turnEffects?.healed) { showFloatingLabel(active, `+${result.turnEffects.healed}`, "heal-number"); await skillEffects.support(active, "petal-regrowth"); }
          setNotice(result.missed ? "battle.darkMagicMiss" : "battle.enemyTurn", {
            name: active.name, skill: t(result.skill.nameKey), damage: result.damage
          });
          await finishDisplayedTurn();
        }
      }

      async function onUnitClick(unit) {
        if (busy || !targeting || !isPlayerTurn()) return;
        const active = currentUnit();
        const skillId = targeting;
        const valid = validTargets(state, active.id, skillId);
        if (!valid.some((candidate) => candidate.id === unit.id)) {
          setNotice(unit.side === "enemy" && isProtected(state, unit) ? "battle.protected"
            : state.skills[skillId]?.target === "singleAlly" ? "battle.chooseAllyTarget" : "battle.chooseTarget");
          return;
        }
        busy = true;
        renderControls();
        if (skillId !== "claw") {
          try {
            await persistSkillSpend(skillId, $("#skillOne"));
          } catch (error) {
            console.error("Unable to spend dragon energy", error);
            targeting = null;
            busy = false;
            setNotice("battle.energySaveError");
            render();
            return;
          }
        }
        const roll = Math.random();
        let result;
        if (skillId === "claw") {
          const damage = calculateDamage(state, active, unit, skillId, () => roll);
          await playAttackAnimation(active, unit, damage);
          result = useDamageSkill(state, active.id, unit.id, skillId, () => roll);
        } else {
          result = useSkill(state, active.id, unit.id, skillId, () => roll);
          await playSkillResult(result);
        }
        if (result.turnEffects?.healed) { showFloatingLabel(active, `+${result.turnEffects.healed}`, "heal-number"); await skillEffects.support(active, "petal-regrowth"); }
        targeting = null;
        if (result.skill.type === "heal") {
          setNotice("battle.skillHealNotice", {
            name: active.name, skill: t(result.skill.nameKey), target: unit.name,
            amount: result.applied?.[0]?.healed || 0
          });
        } else if (result.skill.type === "damage") {
          const totalDamage = result.hits?.reduce((sum, hit) => sum + hit.hpDamage, 0) ?? result.damage;
          const notice = t("battle.playerAttack", { name: active.name, skill: t(result.skill.nameKey), target: unit.name, damage: totalDamage });
          $("#notice").textContent = result.delayedTurns
            ? `${notice} ${t("battle.vinesDelay", { target: unit.name, delay: result.delayedTurns })}`
            : notice;
        } else {
          setNotice(result.skill.target === "allEnemies" ? "battle.skillEnemyNotice" : "battle.skillTeamNotice", {
            name: active.name, skill: t(result.skill.nameKey)
          });
        }
        await finishDisplayedTurn();
        if (result.outcome === "playing") await runEnemyTurns();
      }

      function configureButtons() {
        $("#skillOne").textContent = t("battle.skillOne");
        $("#claw").title = t("battle.claw");
        $("#claw").setAttribute("aria-label", t("battle.claw"));
        $("#skillOne").title = t("battle.skillOne");
        $("#skillOne").setAttribute("aria-label", t("battle.skillOne"));
        const skillButton = $("#skillOne");
        const showSkillPreview = () => {
          if (!skillButton.disabled && skillOne) showSkillEnergyPreview(skillButton, true);
        };
        skillButton.addEventListener("mouseenter", showSkillPreview);
        skillButton.addEventListener("focus", showSkillPreview);
        skillButton.addEventListener("mouseleave", () => {
          if (targeting !== skillOne?.id) showSkillEnergyPreview(skillButton, false);
        });
        skillButton.addEventListener("blur", () => {
          if (targeting !== skillOne?.id) showSkillEnergyPreview(skillButton, false);
        });
        $("#skip").title = t("battle.skip");
        $("#skip").setAttribute("aria-label", t("battle.skip"));
        $("#flee").title = t("battle.flee");
        $("#flee").setAttribute("aria-label", t("battle.flee"));
        $("#returnHome").textContent = t(fromPractice ? "practice.backToArenas" : "battle.returnHome");
        $("#claw").addEventListener("click", () => {
          if (busy || !isPlayerTurn()) return;
          enemyClicks.clear();
          targeting = "claw";
          setNotice("battle.chooseTarget");
          render();
        });
        $("#skillOne").addEventListener("click", async () => {
          enemyClicks.clear();
          if (!skillOne || busy || !isPlayerTurn() || currentUnit()?.id !== "dragon" || remainingSkillCharges(state) < Math.max(1, Number(skillOne.energyCost) || 1)) return;
          if (skillOne.target === "singleEnemy" || skillOne.target === "singleAlly") {
            targeting = skillOne.id;
            showSkillEnergyPreview(skillButton, true);
            setNotice(skillOne.target === "singleAlly" ? "battle.chooseAllyTarget" : "battle.chooseTarget");
            render();
            return;
          }
          const active = currentUnit();
          const targets = validTargets(state, active.id, skillOne.id);
          if (!targets.length) {
            if (skillOne.target === "singleAlly") setNotice("battle.noHealTarget");
            return;
          }
          busy = true;
          targeting = null;
          render();
          try {
            await persistSkillSpend(skillOne.id, skillButton);
          } catch (error) {
            console.error("Unable to spend dragon energy", error);
            busy = false;
            setNotice("battle.energySaveError");
            render();
            return;
          }
          const result = useSkill(state, active.id, null, skillOne.id);
          await playSkillResult(result);
          if (result.turnEffects?.healed) { showFloatingLabel(active, `+${result.turnEffects.healed}`, "heal-number"); await skillEffects.support(active, "petal-regrowth"); }
          setNotice(result.skill.target === "allEnemies" ? "battle.skillEnemyNotice" : "battle.skillTeamNotice", {
            name: active.name, skill: t(result.skill.nameKey)
          });
          await finishDisplayedTurn();
          await runEnemyTurns();
        });
        $("#skip").addEventListener("click", async () => {
          enemyClicks.clear();
          if (busy || !isPlayerTurn()) return;
          busy = true;
          const active = currentUnit();
          const skipped = skipTurn(state, active.id);
          if (skipped.turnEffects?.healed) { showFloatingLabel(active, `+${skipped.turnEffects.healed}`, "heal-number"); await skillEffects.support(active, "petal-regrowth"); }
          targeting = null;
          setNotice("battle.skipNotice", { name: active.name });
          await finishDisplayedTurn();
          await runEnemyTurns();
        });
        $("#flee").addEventListener("click", () => {
          enemyClicks.clear();
          if (busy) return;
          busy = true;
          fleeBattle(state);
          targeting = null;
          setNotice("battle.fleeNotice");
          render();
          showBattleResult();
        });
        $("#returnHome").addEventListener("click", () => location.assign(returnPageForResult()));
      }

      await loadUI();
      document.title = t("battle.title");
      configureButtons();

      onAuthStateChanged(auth, async (user) => {
        if (!user) { location.replace("index.html"); return; }
        try {
          activeDragonRef = doc(db, "users", user.uid, "dragon", "current");
          const [dragonSnapshot, progressSnapshot, adventureProfileSnapshot, library, battleLibrary, battleContent, battleAssets, balance, skillData, companionLibrary, enemyBehaviors, progression] = await Promise.all([
            getDoc(activeDragonRef),
            getDoc(doc(db, "users", user.uid, "progress", "summary")),
            getDoc(doc(db, "users", user.uid, "adventure", "profile")).catch(() => null),
            loadJson("assets/dragons/dragon-library.json"),
            loadJson("data/battle-library.json"),
            loadJson("content/battle.zh-CN.json"),
            loadJson("assets/battle/battle-assets.json"),
            loadJson("data/battle-balance.json"),
            loadJson("data/skills.json"),
            loadJson("data/companions.json"),
            loadJson("data/enemy-behaviors.json"),
            loadJson("data/dragon-progression.json")
          ]);
          if (!dragonSnapshot.exists()) { location.replace("journey.html"); return; }
          const dragonData = dragonSnapshot.data();
          adventureDragon = dragonData;
          adventureProgression = progression;
          const initialEnergy = await changeStoredEnergy(0);
          const species = library.find((item) => item.id === dragonData.speciesId);
          const battle = battleLibrary.battles.find((item) => item.id === requestedBattleId);
          if (battle?.requiredLevel && Number(dragonData.level ?? 1) < battle.requiredLevel) {
            location.replace("practice-battles.html");
            return;
          }
          const background = battleAssets.backgrounds.find((item) => item.id === battle?.backgroundId);
          if (!species || !battle || !background) throw new Error("Missing battle configuration");
          $("#replayMatch").href = `battle.html?battle=${encodeURIComponent(battle.id)}&from=practice`;
          $(".battlefield").style.backgroundImage = `url("${background.path}")`;
          $("#sceneName").textContent = battleContent[battle.sceneNameKey];
          $("#battleName").textContent = battleContent[battle.nameKey];
          $("#battleName").title = battleContent[battle.descriptionKey];
          impactImagePath = battleAssets.actions.find((item) => item.id === "claw-impact")?.path || "";
          for (const effect of battleAssets.effects) {
            spellTextures.set(effect.skillId, new URL(effect.path, document.baseURI).href);
          }
          state = createBattle({
            dragon: {
              name: dragonData.customName || species.name,
              battleSlot: dragonData.battleSlot,
              stats: {
                stamina: effectiveStamina(dragonData, await loadCheckins(user.uid)),
                attack: dragonData.attack ?? 10,
                defense: dragonData.defense ?? 10,
                speed: dragonData.speed ?? 10
              }
            },
            dragonImage: species.image,
            enemies: battle.enemies,
            enemyAssets: battleAssets.enemies,
            balance,
            skills: skillData.skills,
            skillOneId: skillData.skillOneBySpecies?.[species.id],
            initialEnergy,
            enemyBehaviors,
            startingHp: fromAdventure && query.has("hp") && Number.isFinite(Number(query.get("hp"))) && Number(query.get("hp")) > 0 ? Number(query.get("hp")) : null,
            companions: deployedCompanions(companionLibrary, user, dragonData, mergeCompanionProfiles(adventureProfileSnapshot?.exists() ? adventureProfileSnapshot.data() : null, localAdventureProfile(user.uid))).map((entry) => ({ ...entry, name: t(entry.nameKey) }))
          });
          skillOne = state.skills[state.skillOneId];
          if (skillOne) {
            const button = $("#skillOne");
            const action = battleAssets.actions.find((entry) => entry.id === skillOne.id);
            const icon = document.createElement("img");
            const fallback = document.createElement("span");
            icon.alt = "";
            icon.onerror = () => { icon.hidden = true; fallback.hidden = false; };
            icon.onload = () => { icon.hidden = false; fallback.hidden = true; };
            if (action?.path) icon.src = action.path;
            else icon.hidden = true;
            fallback.className = "skill-button-fallback";
            fallback.textContent = skillOne.iconGlyph || "✦";
            fallback.hidden = Boolean(action?.path);
            button.replaceChildren(icon, fallback);
          }
          render();
          await showBattleIntro(battleContent[battle.nameKey], progressSnapshot.data());
        } catch (error) {
          console.error("Unable to start battle", error);
          setNotice("battle.loadError");
        }
      });
    </script>
  </body>
</html>
