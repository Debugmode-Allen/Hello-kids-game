<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title></title><link rel="stylesheet" href="css/village.css?v=20261118-companions" /></head>
<body>
<main class="village-page">
  <header class="village-header"><a href="adventure.html" data-copy="village.back"></a><span data-copy="village.eyebrow"></span></header>
  <section class="village-heading"><p class="eyebrow" data-copy="village.eyebrow"></p><h1 data-copy="village.title"></h1><p data-copy="village.intro"></p></section>
  <p id="status" role="status"></p>
  <div class="village-layout" id="villageContent" hidden>
    <aside class="dragon-card"><div class="portrait"><img id="dragonImage" alt="" /></div><h2 id="dragonName"></h2><p id="dragonIdentity"></p><p id="dragonLevel"></p><span class="energy-badge" id="dragonEnergy"></span><dl class="dragon-stats" id="dragonStats"></dl><p class="small-note" id="staminaNotice" hidden></p><a class="practice-link" href="practice.html" data-copy="village.practice"></a></aside>
    <section class="management-card">
      <div class="village-tabs" role="tablist" aria-label="" id="villageTabs">
        <button id="tab-skills" type="button" role="tab" aria-controls="panel-skills" aria-selected="true" data-tab="skills" data-copy="village.skills"></button>
        <button id="tab-formation" type="button" role="tab" aria-controls="panel-formation" aria-selected="false" tabindex="-1" data-tab="formation" data-copy="village.formation"></button>
        <button id="tab-items" type="button" role="tab" aria-controls="panel-items" aria-selected="false" tabindex="-1" data-tab="items" data-copy="village.items"></button>
      </div>
      <section id="panel-skills" role="tabpanel" aria-labelledby="tab-skills" tabindex="0"><h2 data-copy="village.skills"></h2><p class="panel-intro" data-copy="village.skillIntro"></p><div class="points-banner"><span data-copy="village.points"></span><strong data-copy="village.pending"></strong></div><p class="small-note" data-copy="village.pointsHint"></p><div id="skillList" class="skill-list"></div></section>
      <section id="panel-formation" role="tabpanel" aria-labelledby="tab-formation" tabindex="0" hidden><h2 data-copy="village.formation"></h2><p class="panel-intro" data-copy="village.formationIntro"></p><p class="small-note" data-copy="village.formationHint"></p><section class="companion-picker"><h3 data-copy="village.companionTitle"></h3><p class="small-note" data-copy="village.companionHint"></p><div id="companionRoster" class="companion-roster" role="group"></div><button id="removeCompanion" class="secondary-button" type="button" data-copy="village.removeCompanion" hidden></button></section><div id="formationBoard" class="formation-board" role="group" aria-label=""></div><p id="formationStatus" role="status"></p><p id="formationProtectionStatus" class="protection-preview-note" role="status" aria-live="polite"></p><aside class="formation-rules"><h3 data-copy="village.protectionTitle"></h3><p class="small-note" data-copy="village.rowExplanation"></p><p class="small-note" data-copy="village.formationRule"></p><p class="small-note" data-copy="village.protectionNote"></p></aside><div class="formation-footer"><p id="formationSaveStatus" role="status" aria-live="polite"></p><div class="formation-actions"><button class="secondary-button" type="button" id="resetFormation" data-copy="village.resetFormation"></button><button class="confirm-button" type="button" id="confirmFormation" data-copy="village.confirmFormation" disabled></button></div></div></section>
      <section id="panel-items" role="tabpanel" aria-labelledby="tab-items" tabindex="0" hidden><h2 data-copy="village.items"></h2><p class="panel-intro" data-copy="village.itemsIntro"></p><div class="bag-empty"><span aria-hidden="true">🎒</span><h3 data-copy="village.bagTitle"></h3><p data-copy="village.bagHint"></p></div></section>
    </section>
  </div>
</main><script type="module" src="js/village-page.js?v=20261118-companions"></script>
</body></html>
