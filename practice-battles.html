<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>对战模拟</title>
    <link rel="stylesheet" href="css/practice.css" />
    <link rel="stylesheet" href="css/practice-battles.css?v=arena-energy-center-20261118c" />
    <link rel="stylesheet" href="css/energy-meter.css?v=rainbow-energy-20261118" />
  </head>
  <body>
    <main class="practice-page">
      <a class="back-link" href="practice.html" data-copy="practice.return"></a>
      <header class="practice-hero arena-hero">
        <div class="hero-copy">
          <h1 data-copy="practice.simulation"></h1>
          <p id="dragonName" class="dragon-name" hidden></p>
          <p id="dragonLevel" class="dragon-level" hidden></p>
          <p id="status" role="status"></p>
        </div>
        <div id="arenaEnergyPanel" class="arena-energy-panel" tabindex="0" hidden>
          <div id="arenaEnergyMeter" class="arena-energy-meter"></div>
          <p id="arenaEnergyCount" class="arena-energy-count"></p>
          <p id="arenaEnergyHint" class="arena-energy-hint"></p>
        </div>
        <img id="dragonImage" class="hero-dragon" alt="" hidden />
      </header>

      <section class="arena-grid" id="practiceOptions" hidden>
        <article class="arena-card meadow-arena">
          <div class="arena-scene">
            <img src="assets/battle/enemies/leaf-caterpillar-left.png" alt="" />
            <img src="assets/battle/enemies/moon-moth-left.png" alt="" />
          </div>
          <div class="arena-body">
            <p class="arena-requirement" data-copy="practice.arenaOpen"></p>
            <h2 data-copy="practice.meadow"></h2>
            <p class="arena-detail" data-copy="practice.meadowDetail"></p>
            <a class="arena-action" href="battle.html?from=practice" data-copy="practice.startMatch"></a>
          </div>
        </article>
        <article class="arena-card advanced-arena" data-unlock-level="1">
          <div class="arena-scene preview-scene">
            <img class="arena-enemy-preview" src="assets/battle/enemies/leaf-caterpillar-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/leaf-caterpillar-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
          </div>
          <div class="arena-body">
            <p class="arena-requirement"></p>
            <h2 data-copy="practice.advanced"></h2>
            <p class="arena-detail" data-copy="practice.advancedDetail"></p>
            <a class="arena-action" href="battle.html?battle=practice-advanced&amp;from=practice" data-copy="practice.startMatch"></a>
          </div>
        </article>
        <article class="arena-card expert-arena" data-unlock-level="11">
          <div class="arena-scene preview-scene">
            <img class="arena-enemy-preview" src="assets/battle/enemies/leaf-caterpillar-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/leaf-caterpillar-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
            <img class="arena-enemy-preview" src="assets/battle/enemies/moon-moth-left.png" alt="" />
          </div>
          <div class="arena-body">
            <p class="arena-requirement"></p>
            <h2 data-copy="practice.levelEleven"></h2>
            <p class="arena-detail" data-copy="practice.levelElevenDetail"></p>
            <a class="arena-action" href="battle.html?battle=practice-level-11&amp;from=practice" data-copy="practice.startMatch"></a>
          </div>
        </article>
      </section>
    </main>

    <script type="module">
      import { mountPracticePage } from "./js/practice-page.js?v=arena-energy-20261118";
      import { t } from "./js/i18n.js";
      import { renderEnergyMeter } from "./js/energy-meter.js?v=rainbow-energy-20261118";

      await mountPracticePage({
        titleKey: "practice.simulation",
        optionsLabel: "practice.arenaOptions",
        onDragonLoaded(level, dragon) {
          const meter = document.querySelector("#arenaEnergyMeter");
          try {
            renderEnergyMeter(meter, {
              currentEnergy: dragon?.energy,
              capacity: 10,
              label: (current, capacity) => t("charge.energyMeterLabel", { current, capacity })
            });
            document.querySelector("#arenaEnergyCount").textContent = t("practice.energyCharge", {
              current: Math.max(0, Math.min(10, Math.floor(Number(dragon?.energy) || 0))), capacity: 10
            });
            document.querySelector("#arenaEnergyHint").textContent = t("practice.energyHint");
            document.querySelector("#arenaEnergyPanel").hidden = false;
          } catch (error) {
            console.warn("Unable to render arena energy meter", error);
            document.querySelector("#arenaEnergyPanel").hidden = true;
          }
          for (const arena of document.querySelectorAll("[data-unlock-level]")) {
            const required = Number(arena.dataset.unlockLevel);
            const remaining = required - level;
            arena.querySelector(".arena-requirement").textContent = t(
              remaining > 0 ? "practice.arenaLocked" : "practice.arenaThresholdMet",
              { level: required, remaining }
            );
            const action = arena.querySelector("a.arena-action");
            if (action && remaining > 0) {
              action.classList.add("unavailable");
              action.setAttribute("aria-disabled", "true");
              action.addEventListener("click", (event) => event.preventDefault());
            }
          }
        }
      });
    </script>
  </body>
</html>
