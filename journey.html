<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="css/journey-options.css" />
    <style>
      :root { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #172554; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 76px 20px 32px; background: #eef7ff; }
      .card { width: min(100%, 680px); margin: 0 auto; padding: 40px 28px; text-align: center; background: #fff; border-radius: 24px; }
      .hidden { display: none !important; }
      .egg img, #image { height: 150px; max-width: 100%; object-fit: contain; }
      .egg { display: inline-flex; flex-direction: column; align-items: center; min-width: 132px; }
      .pulse { animation: pulse .4s infinite; }
      @keyframes pulse { 50% { transform: scale(1.1) rotate(3deg); } }
      button { padding: 12px; margin: 6px; border: 0; border-radius: 12px; background: #4d86f7; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      input { width: min(280px, 90%); padding: 12px; border: 2px solid #9dbcf7; border-radius: 12px; font: inherit; }
      #score { color: #1d4ed8; font-weight: 700; }
      #message { min-height: 1.5em; }
      @media (max-width: 430px) { body { padding: 68px 12px 20px; } .card { padding: 30px 16px; } .egg { min-width: 92px; padding: 7px; } .egg img { height: 110px; } }
    </style>
  </head>
  <body>
    <main class="card">
      <section id="story">
        <h1 id="storyTitle"></h1>
        <p id="storyBody"></p>
        <p id="storyBody2"></p>
        <button id="begin" type="button"></button>
      </section>

      <section id="eggs" class="hidden">
        <h1 id="chooseEggTitle"></h1>
        <button class="egg" type="button" data-egg="fire"><img src="assets/eggs/fire-egg.png" alt="" /><span id="fireEggName"></span></button>
        <button class="egg" type="button" data-egg="forest"><img src="assets/eggs/forest-egg.png" alt="" /><span id="forestEggName"></span></button>
        <button class="egg" type="button" data-egg="star"><img src="assets/eggs/star-tide-egg.png" alt="" /><span id="starEggName"></span></button>
      </section>

      <section id="quiz" class="hidden">
        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="options"></div>
        <button id="next" class="hidden" type="button"></button>
      </section>

      <section id="hatch" class="hidden">
        <h1 id="heading"></h1>
        <img id="image" alt="" />
        <h2 id="dragon"></h2>
        <p id="info"></p>
        <p id="score"></p>
        <button id="open" type="button"></button>
        <p id="message"></p>
        <div id="namePanel" class="hidden">
          <label><span id="nameLabel"></span><br /><input id="dragonName" maxlength="16" /></label>
          <p><button id="confirmName" type="button"></button></p>
        </div>
      </section>
    </main>

    <script type="module">
      import { auth, db, doc, setDoc, onAuthStateChanged } from "./js/firebase.js";
      import { createAdaptiveAssessment } from "./js/assessment.js";
      import { eggImages, lock } from "./js/hatching.js";
      import { reserveDragonAndSaveAssessment } from "./js/progress-store.js";
      import { loadUI, t } from "./js/i18n.js";

      const $ = (selector) => document.querySelector(selector);
      const show = (section) => ["story", "eggs", "quiz", "hatch"].forEach((name) => $("#" + name).classList.toggle("hidden", name !== section));
      const loadJson = async (path) => {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      };

      await loadUI();
      const [story, dragons] = await Promise.all([
        loadJson("content/story.zh-CN.json"),
        loadJson("assets/dragons/dragon-library.json")
      ]);

      document.title = story["story.welcome.title"];
      $("#storyTitle").textContent = story["story.welcome.title"];
      $("#storyBody").textContent = story["story.welcome.body"];
      $("#storyBody2").textContent = story["story.welcome.body2"];
      $("#begin").textContent = story["story.welcome.cta"];
      $("#chooseEggTitle").textContent = t("journey.chooseEgg");
      $("#fireEggName").textContent = story["egg.fire.name"];
      $("#forestEggName").textContent = story["egg.forest.name"];
      $("#starEggName").textContent = story["egg.star.name"];
      $("#open").textContent = t("journey.openEgg");
      $("#nameLabel").textContent = t("journey.nameLabel");
      $("#dragonName").placeholder = t("journey.namePlaceholder");
      $("#confirmName").textContent = t("journey.confirmName");

      let user;
      let selectedEgg;
      let assessment;
      let hatchedDragon;

      onAuthStateChanged(auth, (currentUser) => {
        if (!currentUser) { location.replace("index.html"); return; }
        user = currentUser;
      });

      $("#begin").addEventListener("click", () => show("eggs"));
      document.querySelectorAll(".egg").forEach((button) => button.addEventListener("click", () => {
        selectedEgg = button.dataset.egg;
        assessment = createAdaptiveAssessment();
        show("quiz");
        drawQuestion();
      }));

      function drawQuestion() {
        const question = assessment.next();
        $("#progress").textContent = t("journey.questionProgress", { current: assessment.answers.length + 1, total: assessment.total });
        $("#question").textContent = question.question;
        $("#options").replaceChildren();
        delete $("#options").dataset.answer;
        $("#next").classList.add("hidden");
        question.options.forEach((answer) => {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "option";
          option.textContent = answer;
          option.addEventListener("click", () => {
            document.querySelectorAll(".option").forEach((item) => item.classList.remove("selected"));
            option.classList.add("selected");
            $("#options").dataset.answer = answer;
            $("#next").textContent = assessment.answers.length === assessment.total - 1 ? t("journey.finish") : t("journey.next");
            $("#next").classList.remove("hidden");
          });
          $("#options").append(option);
        });
      }

      $("#next").addEventListener("click", () => {
        const choice = $("#options").dataset.answer;
        if (!assessment?.next() || choice === undefined) return;
        delete $("#options").dataset.answer;
        assessment.answer(choice);
        if (assessment.next()) { drawQuestion(); return; }
        $("#heading").textContent = story["hatching.glowing"];
        $("#image").src = eggImages[selectedEgg];
        $("#image").alt = story[`egg.${selectedEgg}.name`];
        $("#image").className = "pulse";
        show("hatch");
      });

      $("#open").addEventListener("click", async () => {
        if (!user || !lock($("#open"), t("journey.hatching"))) return;
        try {
          const { answers, levels } = assessment;
          const dragon = await reserveDragonAndSaveAssessment(user.uid, selectedEgg, dragons, answers, levels);
          const score = Math.round(answers.filter((answer) => answer.correct).length * 100 / assessment.total);
          $("#image").className = "";
          $("#image").src = dragon.image;
          $("#image").alt = dragon.name;
          $("#heading").textContent = story["hatching.title"];
          $("#dragon").textContent = dragon.name;
          $("#info").textContent = t("journey.dragonInfo", { profession: dragon.profession, description: dragon.description });
          $("#score").textContent = `${t("journey.score", { score })}${score === 100 ? ` · ${t("journey.perfect")}` : ""}`;
          $("#message").textContent = t("journey.namePrompt");
          $("#namePanel").classList.remove("hidden");
          hatchedDragon = dragon;
        } catch (error) {
          console.error("Assessment save failed", error);
          $("#message").textContent = t("journey.saveError", { code: error.code || t("journey.unknownCode"), message: error.message || t("journey.unknownError") });
          $("#open").disabled = false;
          $("#open").classList.remove("hidden");
          delete $("#open").dataset.locked;
        }
      });

      $("#confirmName").addEventListener("click", async () => {
        if (!user || !hatchedDragon) return;
        const name = $("#dragonName").value.trim() || hatchedDragon.name;
        try {
          await setDoc(doc(db, "users", user.uid, "dragon", "current"), { customName: name }, { merge: true });
          location.assign("home.html");
        } catch (error) {
          console.error("Dragon naming failed", error);
          $("#message").textContent = t("journey.saveError", { code: error.code || t("journey.unknownCode"), message: error.message || t("journey.unknownError") });
        }
      });
    </script>
  </body>
</html>
