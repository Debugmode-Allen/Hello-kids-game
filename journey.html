<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星鳞龙岛</title><style>body{font-family:"Microsoft YaHei";background:#eef7ff;padding:24px}.card{position:relative;max-width:680px;margin:auto;background:#fff;padding:44px 28px;border-radius:24px;text-align:center}.hidden{display:none}.logout{position:absolute;top:12px;right:12px;background:#eef2f8;color:#52617a;font-size:12px}.egg img,#image{height:150px;max-width:100%;object-fit:contain}.option{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:12px;background:#edf4ff}.selected{background:#4d86f7;color:#fff}.pulse{animation:p .4s infinite}@keyframes p{50%{transform:scale(1.1) rotate(3deg)}}button{padding:12px;border:0;border-radius:12px;background:#4d86f7;color:#fff;margin:6px}</style><body><main class="card"><button id="logout" class="logout">退出账户</button><section id="story"><h1 id="title"></h1><p id="body"></p><p id="body2"></p><button id="begin"></button></section><section id="eggs" class="hidden"><h1>选择龙蛋</h1><button class="egg" data-e="fire"><img src="assets/eggs/fire-egg.png"><br>炽焰蛋</button><button class="egg" data-e="forest"><img src="assets/eggs/forest-egg.png"><br>森林蛋</button><button class="egg" data-e="star"><img src="assets/eggs/star-tide-egg.png"><br>星潮蛋</button></section><section id="quiz" class="hidden"><p id="progress"></p><h2 id="question"></h2><div id="options"></div><button id="next" class="hidden"></button></section><section id="hatch" class="hidden"><h1 id="heading"></h1><img id="image"><h2 id="dragon"></h2><p id="info"></p><button id="open">轻轻敲开龙蛋</button><p id="message"></p></section></main><script type="module">import{auth,signOut,onAuthStateChanged}from"./js/firebase.js";import{createAssessment,calculateLevels}from"./js/assessment.js";import{eggImages,pickDragon,lock}from"./js/hatching.js";import{saveAssessment}from"./js/progress-store.js";const $=x=>document.querySelector(x),story=await fetch("content/story.zh-CN.json").then(r=>r.json()),dragons=await fetch("assets/dragons/dragon-library.json").then(r=>r.json());let user,egg,qs=[],i=0,answers=[];const show=x=>["story","eggs","quiz","hatch"].forEach(k=>$("#"+k).classList.toggle("hidden",k!==x));$("#title").textContent=story["story.welcome.title"];$("#body").textContent=story["story.welcome.body"];$("#body2").textContent=story["story.welcome.body2"];$("#begin").textContent=story["story.welcome.cta"];onAuthStateChanged(auth,u=>{if(!u)return location.replace("index.html");user=u});$("#logout").onclick=()=>signOut(auth);$("#begin").onclick=()=>show("eggs");document.querySelectorAll(".egg").forEach(b=>b.onclick=()=>{egg=b.dataset.e;qs=createAssessment();show("quiz");draw()});function draw(){const q=qs[i];$("#progress").textContent=`第 ${i+1}/10 题`;$("#question").textContent=q.question;$("#options").innerHTML="";q.options.forEach(a=>{const b=document.createElement("button");b.className="option";b.textContent=a;b.onclick=()=>{document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("#options").dataset.answer=a;$("#next").textContent=i===9?"完成测试，唤醒龙蛋":"下一题";$("#next").classList.remove("hidden")};$("#options").append(b)})}$("#next").onclick=()=>{const q=qs[i];answers.push({subject:q.subject,grade:q.grade,correct:$("#options").dataset.answer===q.answer});$("#next").classList.add("hidden");if(++i<10)return draw();$("#heading").textContent="龙蛋正在发光！";$("#image").src=eggImages[egg];$("#image").className="pulse";show("hatch")};$("#open").onclick=async()=>{if(!lock($("#open")))return;try{const dragon=pickDragon(egg,dragons),levels=calculateLevels(answers);await saveAssessment(user.uid,egg,dragon,answers,levels);$("#image").className="";$("#image").src=dragon.image;$("#heading").textContent=story["hatching.title"];$("#dragon").textContent=dragon.name;$("#info").textContent=`职业：${dragon.profession}。${dragon.description}`;$("#message").textContent="已保存学习记录！"}catch(e){$("#message").textContent="保存失败，请检查 Firestore 规则。";$("#open").disabled=false;delete $("#open").dataset.locked}}</script></body></html>
