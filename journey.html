<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星鳞龙岛</title>
<style>body{font-family:"Microsoft YaHei";background:#eef7ff;margin:0;padding:24px}.card{position:relative;max-width:680px;margin:auto;background:#fff;padding:46px 28px 28px;border-radius:24px;text-align:center}.hidden{display:none}.logout{position:absolute;right:14px;top:14px;background:#eef2f8;color:#52617a;font-size:12px}.egg img,#pic{height:150px;max-width:100%;object-fit:contain}.option{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:12px;background:#edf4ff}.selected{background:#4d86f7;color:#fff}.pulse{animation:p .4s infinite}@keyframes p{50%{transform:scale(1.1) rotate(3deg)}}button{padding:12px;border:0;border-radius:12px;background:#4d86f7;color:#fff;margin:6px}</style></head>
<body><main class="card"><button id="logout" class="logout">退出账户</button><section id="start"><h1>欢迎来到星鳞龙岛</h1><button id="begin">选择龙蛋</button></section><section id="eggs" class="hidden"><h1>选择龙蛋</h1><button class="egg" data-egg="fire"><img src="assets/eggs/fire-egg.png"><br>炽焰蛋</button><button class="egg" data-egg="forest"><img src="assets/eggs/forest-egg.png"><br>森林蛋</button><button class="egg" data-egg="star"><img src="assets/eggs/star-tide-egg.png"><br>星潮蛋</button></section><section id="quiz" class="hidden"><p id="progress"></p><h2 id="question"></h2><div id="options"></div><button id="next" class="hidden"></button></section><section id="hatch" class="hidden"><h1 id="heading">龙蛋正在发光！</h1><img id="pic"><h2 id="dragon"></h2><p id="message"></p><button id="open">轻轻敲开龙蛋</button></section></main>
<script type="module">import{auth,signOut,onAuthStateChanged}from"./js/firebase.js";import{createAssessment}from"./js/assessment.js";import{eggImages,lock}from"./js/hatching.js";const $=x=>document.querySelector(x);let egg,questions=[],index=0;const show=x=>["start","eggs","quiz","hatch"].forEach(id=>$("#"+id).classList.toggle("hidden",id!==x));onAuthStateChanged(auth,u=>{if(!u)location.replace("index.html")});$("#logout").onclick=()=>signOut(auth);$("#begin").onclick=()=>show("eggs");document.querySelectorAll(".egg").forEach(b=>b.onclick=()=>{egg=b.dataset.egg;questions=createAssessment();show("quiz");draw()});function draw(){const q=questions[index];$("#progress").textContent=`第 ${index+1}/10 题`;$("#question").textContent=q.question;$("#options").innerHTML="";$("#next").classList.add("hidden");q.options.forEach(a=>{const b=document.createElement("button");b.className="option";b.textContent=a;b.onclick=()=>{document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("#next").classList.remove("hidden");$("#next").textContent=index===9?"完成测试，唤醒龙蛋":"下一题"};$("#options").append(b)})}$("#next").onclick=()=>{if(++index<10)return draw();$("#pic").src=eggImages[egg];$("#pic").className="pulse";show("hatch")};$("#open").onclick=()=>{if(!lock($("#open")))return;$("#heading").textContent="孵化功能正在恢复中";$("#message").textContent="测试流程已完成。"}</script></body></html>
